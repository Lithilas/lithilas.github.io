<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F4F5F7">
    <title>Žaidimų nuorodos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap">
    <style>
        :root {
            --bg: #F4F5F7; --surface: #FFFFFF; --line: #D9DCE2; --line-strong: #C3C8D1;
            --ink: #14171C; --muted: #5B6270;
            --red: #D92D27; --red-ink: #B3211C; --blue: #1F5FD6; --gray-dot: #9AA1AE;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Barlow', system-ui, sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 28px 16px 64px; font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
        body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 6px; background: var(--ink); z-index: 5; }
        .hidden { display: none !important; }
        .wrap { max-width: 640px; margin: 0 auto; }
        h1 { font: 700 2.6rem/1.05 'Barlow Condensed', sans-serif; margin: 0 0 4px; }
        .muted { color: var(--muted); }
        :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

        .game { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 8px; margin-top: 16px; }
        .game-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
        .num { font: 600 .95rem 'Barlow', sans-serif; color: var(--muted); }
        h2 { font: 700 2rem/1.1 'Barlow Condensed', sans-serif; margin: 0; }
        .desc { color: var(--muted); margin: 2px 0 12px; }

        .link { padding: 12px 0; border-top: 1px solid var(--line); }
        .link-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
        .link-top .btn { flex: 1 1 0; }
        .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; background: var(--gray-dot); }
        .dot.red { background: var(--red); } .dot.blue { background: var(--blue); } .dot.ink { background: var(--ink); }
        .role { font: 700 1.6rem/1.1 'Barlow Condensed', sans-serif; flex: 1 1 calc(100% - 30px); min-width: 0; }
        .url { display: block; margin: 8px 0 0; font: 400 .85rem/1.35 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); word-break: break-all; }

        .btn { min-height: 44px; padding: 8px 16px; font: 600 1rem 'Barlow', sans-serif; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn:active { transform: scale(.97); }
        
        .btn-copy.done { background: var(--ink); border-color: var(--ink); color: #fff; }
        .all { padding: 12px 0 10px; border-top: 1px solid var(--line); }
        .all .btn { width: 100%; }

        details.rules { margin: 0 0 12px; border: 1px solid var(--line-strong); border-radius: 12px; padding: 0 14px; background: var(--bg); }
        details.rules summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
        details.rules ul { margin: 0 0 12px; padding-left: 20px; }
        details.rules li { margin-bottom: 6px; }
        details.rules h4 { margin: 10px 0 6px; font-size: .9rem; color: var(--muted); font-weight: 600; }
        .pin { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px; margin-top: 16px; }
        .pin-row { display: flex; gap: 10px; align-items: center; }
        .pin-row input { flex: 1; min-width: 0; letter-spacing: .3em; text-align: center; font-size: 1.2rem; }
        .pin-row .btn { flex-shrink: 0; }
        .pin-title { font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; }
        details.settings { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px; }
        details.settings summary { cursor: pointer; font-weight: 600; }
        .field { display: grid; grid-template-columns: 1fr; gap: 4px; margin-top: 14px; }
        .field label { font-size: .9rem; font-weight: 600; color: var(--muted); }
        input[type="text"] { width: 100%; padding: 10px 12px; font: 600 1rem 'Barlow', sans-serif; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px; }
        .small { font-size: .85rem; }

        #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 12px; z-index: 10; opacity: 0; transition: .3s; pointer-events: none; font-weight: 600; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Žaidimų nuorodos</h1>
    <p class="muted">Paspauskite „Kopijuoti“ ir išsiųskite nuorodą atitinkamam telefonui.</p>

    <div class="pin" id="pin-card"></div>

    <div id="games"></div>

    <section class="game" style="padding-bottom:18px;">
        <div class="num">Kiti organizatoriai</div>
        <h2>Sukurti naują žaidimą</h2>
        <p class="desc">Bounty Hunter su savo kodu ir savo žaidimo vedėju.</p>
        <a class="btn" style="width:100%;" href="https://lithilas.github.io/BH/create-game.html" target="_blank" rel="noopener">Atidaryti kūrimo puslapį</a>
    </section>

    <details class="settings hidden" id="settings">
        <summary>Adresai ir failų pavadinimai</summary>
        <div class="field">
            <label for="base">Svetainės aplankas (palikite tuščią, jei šis puslapis guli šalia žaidimų)</label>
            <input type="text" id="base" placeholder="https://jusu-svetaine.lt/zaidimai/" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div id="files"></div>
        <p class="muted small" style="margin-top:12px;">Nustatymai išsaugomi tik šioje naršyklėje.</p>
    </details>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
    /* Pridėti naują žaidimą: nukopijuokite bloką į GAMES. dot: red | blue | ink | (tuščia = pilka) */
    const GAMES = [
        { id: 'bounty', rules: [
            'Raudona ir mėlyna komandos turi po vieną bendrą telefoną.',
            'Kiekviena komanda medžioja vieną atsitiktinį gyvą priešo žaidėją.',
            'Nužudymas: nuskenuokite taikinio NFC žymę, tada savo (nužudžiusio žaidėjo) žymę.',
            'Klaidingas skenavimas užrakina telefoną 15 sekundžių.',
            'Žuvę žaidėjai gali toliau rinkti taškus.',
            'Žaidimas baigiasi pasibaigus laikui arba kai komandoje nebelieka gyvų žaidėjų. Laimi komanda su daugiau gyvų žaidėjų, jei vienodai – su daugiau nužudymų.' ], file: 'https://lithilas.github.io/BH/', title: 'Lithilas Bounty Hunter', desc: 'Komandų medžioklė su NFC. Vienas telefonas kiekvienai komandai.',
          links: [
            { label: 'Raudona komanda', q: '?room=LITHILAS&role=RAUDONA', dot: 'red' },
            { label: 'Mėlyna komanda', q: '?room=LITHILAS&role=MELYNA', dot: 'blue' },
            { label: 'Žaidimo vedėjas (GM)', q: '?room=LITHILAS&role=GM', dot: 'ink', gm: true } ] },
        { id: 'points', rules: [
            'Yra du punktai, bet kiekvienu metu aktyvus tik vienas. Aktyvus punktas keičiasi kas nustatytą laiką (iš pradžių 15 min.).',
            'Punktą užima komanda, kuri savo spalvos mygtuką laiko nuspaudusi apie 10 sekundžių, kol užsipildys ratas.',
            'Jei per tą laiką kita komanda paspaudžia savo mygtuką, užėmimas nutraukiamas ir prasideda iš naujo.',
            'Komandai skaičiuojamas laikas, kol ji valdo aktyvų punktą. Kai punktas pasikeičia, valdymas pasibaigia.',
            'Likus 1 minutei iki keitimo suskamba signalas.',
            'Laimi komanda, kuri iki žaidimo pabaigos (iš pradžių 120 min.) surinko daugiau valdymo laiko.' ], file: 'https://lithilas.github.io/HP/', title: 'Hard Point', desc: 'Dviejų punktų užėmimo laikmatis, punktai keičiasi pagal laiką.',
          links: [
            { label: 'Punktas 1', q: '?role=point1', dot: '' },
            { label: 'Punktas 2', q: '?role=point2', dot: '' },
            { label: 'Žaidimo vedėjas (GM)', q: '?role=gm', dot: 'ink', gm: true },
            { label: 'Stebėtojas', q: '?role=observer', dot: '' } ] },
        { id: 'cprush', rules: [
            'Puolėjai užima tris kontrolės taškus iš eilės: KT1, KT2 ir paskutinį KT. Gynėjai juos gina.',
            'Atvykę į tašką puolėjai paspaudžia „Mes atvykome“ – prasideda užėmimo laikmatis (įprastai 20, 18 ir 15 min.).',
            'Kai laikmatis pasiekia nulį, taškas užimtas. Užėmus KT2, tampa nauja bazė, iš kurios keliaujama į paskutinį tašką.',
            'Visas žaidimas trunka 105 minutes. Puolėjai laimi, jei užima visus tris taškus, gynėjai – jei laikas pasibaigia anksčiau.',
            'Puolėjai arba žaidimo vedėjas gali sustabdyti užėmimo laiką pauze, bendras žaidimo laikas tuo metu vis tiek eina.',
            'Gynėjai savo telefone mato žemėlapį ir tai, kuris taškas dabar užimamas.' ], file: 'https://lithilas.github.io/CPRUSH/', title: 'CP Rush', desc: 'Puolėjai užima tris kontrolės taškus, gynėjai gina.',
          links: [
            { label: 'Puolėjai', q: '?role=attacker', dot: '' },
            { label: 'Gynėjai', q: '?role=defender', dot: '' },
            { label: 'Žaidimo vedėjas (GM)', q: '?role=gm', dot: 'ink', gm: true } ] },
        { id: 'terminal', rules: [
            'Žaidimas trunka 105 minutes. Taškai renkami nuskenuojant NFC žymes telefonu.',
            '1 etapas (0–10 min.): pasiruošimas, taškai neaktyvūs.',
            '2 etapas (10–40 min.): kas 10 min. aktyvuojamas vienas taškas. Kiekviena komanda jį gali nuskenuoti vieną kartą: +4 tšk.',
            '3 etapas (40–70 min.): kas 10 min. aktyvūs du taškai, bet vienas jų netikras ir taškų neduoda. Taškas vėl +4 tšk.',
            '4 etapas (70–105 min.): dominavimas, penki taškai. Pirmas skenavimas pradeda 5 min. atrakinimą, po jo pirmoji komanda, nuskenavusi tašką, jį užima: +3 tšk.',
            'Laimi komanda, surinkusi daugiau taškų.' ], file: 'https://lithilas.github.io/Terminal/', title: 'Lithilas terminalas', desc: 'NFC taškų rinkimas 105 min., keturi etapai.',
          links: [
            { label: 'Raudona komanda', q: '?team=raudona', dot: 'red' },
            { label: 'Mėlyna komanda', q: '?team=melyna', dot: 'blue' },
            { label: 'Admin', q: '?role=admin', dot: 'ink', gm: true } ] }
    ];

    const store = {
        get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /* GM nuorodos rodomos tik įvedus PIN (tai tik paslėpimas puslapyje, ne tikra apsauga) */
    const PIN_HASH = '9dm7gg';
    const hashPin = p => { let h = 5381; const t = 'lt:' + p; for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36); };
    let unlocked = false;
    try { unlocked = sessionStorage.getItem('gm_ok') === PIN_HASH; } catch (e) {}
    const visible = l => !l.gm || unlocked;
    function renderPin() {
        document.getElementById('settings').classList.toggle('hidden', !unlocked);
        document.getElementById('pin-card').innerHTML = unlocked
            ? `<div class="pin-title"><span>Žaidimo vedėjo prieiga atrakinta</span><button class="btn" onclick="lockGm()">Užrakinti</button></div>`
            : `<div class="pin-title">Žaidimo vedėjo prieiga</div>
               <div class="pin-row"><input type="password" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="PIN" autocomplete="off" aria-label="PIN kodas" onkeydown="if(event.key==='Enter')tryPin()">
               <button class="btn btn-primary" onclick="tryPin()">Atrakinti</button></div>`;
    }
    function tryPin() {
        const v = document.getElementById('pin').value.trim();
        if (hashPin(v) !== PIN_HASH) { toast('Neteisingas PIN'); document.getElementById('pin').value = ''; return; }
        unlocked = true; try { sessionStorage.setItem('gm_ok', PIN_HASH); } catch (e) {}
        renderPin(); render();
    }
    function lockGm() { unlocked = false; try { sessionStorage.removeItem('gm_ok'); } catch (e) {} renderPin(); render(); }

    function fileOf(g) { return (store.get('addr_' + g.id, g.file) || g.file).trim(); }
    function urlOf(g, l) {
        let base = store.get('base2', '').trim();
        if (base && !base.endsWith('/')) base += '/';
        const f = fileOf(g);
        const path = f + l.q;
        if (/^https?:\/\//i.test(f)) return path;            // pilnas adresas: naudojamas kaip yra
        if (base) return base + f.replace(/^\//, '') + l.q;
        try { return new URL(path, location.href).href; } catch (e) { return path; }
    }

    function render() {
        document.getElementById('games').innerHTML = GAMES.map((g, i) => `
            <section class="game">
                <div class="game-head"><div><div class="num">Žaidimas ${i + 1}</div><h2>${esc(g.title)}</h2></div></div>
                <p class="desc">${esc(g.desc)}</p>
                <details class="rules"><summary>Taisyklės</summary><ul>${g.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></details>
                ${g.links.map((l, j) => !visible(l) ? '' : `
                    <div class="link">
                        <div class="link-top">
                            <i class="dot ${l.dot}"></i><span class="role">${esc(l.label)}</span>
                            <button class="btn btn-copy" data-g="${i}" data-l="${j}" onclick="copyLink(this)">Kopijuoti</button>
                            <a class="btn" href="${esc(urlOf(g, l))}" target="_blank" rel="noopener">Atidaryti</a>
                        </div>
                        <span class="url">${esc(urlOf(g, l))}</span>
                    </div>`).join('')}
                <div class="all"><button class="btn" data-g="${i}" onclick="copyAll(this)">Kopijuoti visas ${esc(g.title)} nuorodas</button></div>
            </section>`).join('');
    }

    function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
        return new Promise((res, rej) => {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); } finally { ta.remove(); }
        });
    }
    let toastTimer;
    function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.className = 'show'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 2200); }
    function copyLink(btn) {
        const g = GAMES[+btn.dataset.g], l = g.links[+btn.dataset.l];
        copyText(urlOf(g, l)).then(() => {
            btn.textContent = 'Nukopijuota'; btn.classList.add('done');
            setTimeout(() => { btn.textContent = 'Kopijuoti'; btn.classList.remove('done'); }, 1500);
        }).catch(() => toast('Nepavyko nukopijuoti – pažymėkite nuorodą ranka'));
    }
    function copyAll(btn) {
        const g = GAMES[+btn.dataset.g];
        const text = g.title + '\n' + g.links.filter(visible).map(l => `${l.label}: ${urlOf(g, l)}`).join('\n');
        copyText(text).then(() => toast('Visos nuorodos nukopijuotos')).catch(() => toast('Nepavyko nukopijuoti', true));
    }

    /* Nustatymai */
    const baseEl = document.getElementById('base');
    baseEl.value = store.get('base2', '');
    baseEl.addEventListener('input', () => { store.set('base2', baseEl.value); render(); });
    document.getElementById('files').innerHTML = GAMES.map(g => `
        <div class="field"><label for="f-${g.id}">${esc(g.title)} – failas arba pilnas adresas</label>
        <input type="text" id="f-${g.id}" value="${esc(fileOf(g))}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`).join('');
    GAMES.forEach(g => document.getElementById('f-' + g.id).addEventListener('input', e => { store.set('addr_' + g.id, e.target.value); render(); }));

    renderPin();
    render();
</script>
</body>
</html>
